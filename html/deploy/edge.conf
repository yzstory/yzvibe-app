# Append to the existing edge nginx config after the site service is healthy.
server {
    listen 80;
    server_name vibe.aiyuki.cc;
    return 308 https://vibe.aiyuki.cc$request_uri;
}

server {
    listen 443 ssl;
    server_name vibe.aiyuki.cc;
    ssl_certificate /etc/nginx/ssl/vibe.aiyuki.cc.pem;
    ssl_certificate_key /etc/nginx/ssl/vibe.aiyuki.cc.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 5m;

    # Docker DNS resolves the service again after container recreation.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $yzvibe_origin http://yzvibe-site:80;
    location / {
        proxy_pass $yzvibe_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
