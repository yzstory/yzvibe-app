# Installed as /root/docker-compose/nginx/conf.d/vibe.yzcloud.icu.conf.
server {
    listen 80;
    server_name vibe.yzcloud.icu;
    return 308 https://vibe.yzcloud.icu$request_uri;
}

server {
    listen 443 ssl;
    server_name vibe.yzcloud.icu;
    ssl_certificate /etc/nginx/ssl/vibe.yzcloud.icu.pem;
    ssl_certificate_key /etc/nginx/ssl/vibe.yzcloud.icu.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 5m;

    # Docker DNS resolves the service again after container recreation.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $yzvibe_origin http://yzvibe-site:80;
    location / {
        proxy_pass $yzvibe_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
