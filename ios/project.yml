# XcodeGen 工程描述：brew install xcodegen && cd ios && xcodegen generate && open YzVibe.xcodeproj
name: YzVibe
options:
  bundleIdPrefix: icu.yzvibe
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
packages:
  YzVibeKit:
    path: .
targets:
  YzVibe:
    type: application
    platform: iOS
    sources:
      - path: App/YzVibe
    dependencies:
      - package: YzVibeKit
        product: YzVibeKit
    info:
      path: App/YzVibe/Info.plist
      properties:
        CFBundleDisplayName: YzVibe
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: 用于扫描电脑终端里的配对二维码
        NSFaceIDUsageDescription: 用于确认高风险审批
        NSLocalNetworkUsageDescription: 用于在局域网内连接你的电脑
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLSchemes: [yzvibe]
    settings:
      base:
        SWIFT_VERSION: "5.10"
        DEVELOPMENT_TEAM: TRVTR5HQP8
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  YzVibe:
    build:
      targets:
        YzVibe: all
    # 安装到手机默认用 Release（Xcode ▸ Run 也走 Release）；需要断点调试时在 Edit Scheme 里临时切回 Debug
    run:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
