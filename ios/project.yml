# XcodeGen 工程描述：brew install xcodegen && cd ios && xcodegen generate && open YzVibe.xcodeproj
name: YzVibe
options:
  bundleIdPrefix: icu.yzvibe
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
packages:
  YzVibeKit:
    path: .
targets:
  YzVibe:
    type: application
    platform: iOS
    sources:
      - path: App/YzVibe
    dependencies:
      - package: YzVibeKit
        product: YzVibeKit
      - target: YzVibeWidgets
        embed: true
    entitlements:
      path: App/YzVibe/YzVibe.entitlements
      properties:
        aps-environment: development
    info:
      path: App/YzVibe/Info.plist
      properties:
        CFBundleDisplayName: YzVibe
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "11"
        # 仅使用 Apple 系统提供的加密（URLSession HTTPS/WSS、Keychain）。
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # 收到静默推送时在后台补一次数据
        UIBackgroundModes: [remote-notification]
        # 锁屏 / 灵动岛上的会话状态
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSCameraUsageDescription: 用于扫描电脑终端里的配对二维码
        NSFaceIDUsageDescription: 用于确认高风险审批
        NSLocalNetworkUsageDescription: 用于在局域网内连接你的电脑
        # 连接器用 dns-sd 广播 _yzvibe._tcp；隧道地址变了就靠它在同一 Wi-Fi 下找回来
        NSBonjourServices: [_yzvibe._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLSchemes: [yzvibe]
    settings:
      base:
        SWIFT_VERSION: "5.10"
        DEVELOPMENT_TEAM: TRVTR5HQP8
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  YzVibeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets/YzVibeWidgets
    dependencies:
      - package: YzVibeKit
        product: YzVibeKit
    info:
      path: Widgets/YzVibeWidgets/Info.plist
      properties:
        CFBundleDisplayName: YzVibe 实时活动
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "11"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_VERSION: "5.10"
        DEVELOPMENT_TEAM: TRVTR5HQP8
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: icu.yzvibe.YzVibe.Widgets
        SKIP_INSTALL: YES

schemes:
  YzVibe:
    build:
      targets:
        YzVibe: all
    # 安装到手机默认用 Release（Xcode ▸ Run 也走 Release）；需要断点调试时在 Edit Scheme 里临时切回 Debug
    run:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
